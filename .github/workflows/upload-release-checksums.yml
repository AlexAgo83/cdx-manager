name: Upload release checksums

on:
  release:
    types:
      - published
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to update, for example v0.12.2
        required: true

jobs:
  upload:
    name: Generate and upload checksum asset
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || startsWith(github.event.release.tag_name, 'v')
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.event.release.tag_name }}
    steps:
      - name: Checkout main
        uses: actions/checkout@v5
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Generate release checksums
        run: python3 scripts/update_release_checksums.py --tag "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY"

      # The tray-asset workflow uploads this ledger after it has added its
      # companion checksums. This workflow records only the Git archive hashes,
      # so it cannot overwrite that complete release asset with the tag's older
      # ledger.
      - name: Record the checksum in the ledger on main
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 scripts/update_release_checksums.py --tag "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY"
          if git diff --quiet -- checksums/release-archives.json; then
            echo "Ledger already records $RELEASE_TAG; nothing to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add checksums/release-archives.json
          git commit -m "chore: record release archive checksums for $RELEASE_TAG"
          git push origin HEAD:main

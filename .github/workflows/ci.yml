name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Lint and test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
          - macos-latest
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Set up Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: python -m pip install -e ".[dev]"

      - name: Lint
        run: |
          python -m ruff check .
          python -m py_compile bin/cdx src/*.py src/commands/*.py scripts/*.py test/*.py
        env:
          PYTHONPYCACHEPREFIX: ${{ runner.temp }}/pycache

      - name: Test
        run: python -m pytest --cov=src --cov-report=term-missing
        env:
          PYTHONPYCACHEPREFIX: ${{ runner.temp }}/pycache

      - name: Test tray companion
        run: cargo test --manifest-path tray/Cargo.toml

      - name: Package dry-run
        run: npm pack --dry-run
        env:
          npm_config_cache: ${{ runner.temp }}/cdx-npm-cache

      - name: Windows install and CLI smoke
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          npm_config_cache: ${{ runner.temp }}/cdx-npm-cache
        run: |
          $shimDir = Join-Path $env:RUNNER_TEMP "cdx-shims"
          New-Item -ItemType Directory -Force -Path $shimDir | Out-Null

          @'
          @echo off
          if "%1"=="login" if "%2"=="status" (
            echo Logged in using ChatGPT
            exit /b 0
          )
          exit /b 0
          '@ | Set-Content -Path (Join-Path $shimDir "codex.cmd") -Encoding ascii

          @'
          @echo off
          if "%1"=="auth" if "%2"=="status" (
            echo {"loggedIn": true, "authMethod": "oauth"}
            exit /b 0
          )
          exit /b 0
          '@ | Set-Content -Path (Join-Path $shimDir "claude.cmd") -Encoding ascii

          @'
          @echo off
          exit /b 0
          '@ | Set-Content -Path (Join-Path $shimDir "script.cmd") -Encoding ascii

          $env:PATH = "$shimDir;$env:PATH"
          $env:CDX_HOME = Join-Path $env:RUNNER_TEMP "cdx-home"

          npm install -g .
          cdx --version
          cdx add smoke
          cdx add claude smoke-claude
          cdx status --json
          cdx doctor --json
          cdx notify --next-ready --once --json
          cdx rmv smoke --force
          cdx rmv smoke-claude --force

  package-smoke:
    name: Install packaged npm and wheel artifacts
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Set up Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"

      - name: Install build tooling
        run: python -m pip install build

      - name: Build and install npm package
        run: |
          npm pack --pack-destination "$RUNNER_TEMP"
          npm install --global "$RUNNER_TEMP"/cdx-manager-*.tgz
          cdx --version
          cdx schema --json

      - name: Build and install wheel
        run: |
          python -m build --wheel --outdir "$RUNNER_TEMP/wheels"
          python -m venv "$RUNNER_TEMP/cdx-wheel"
          "$RUNNER_TEMP/cdx-wheel/bin/python" -m pip install "$RUNNER_TEMP"/wheels/*.whl
          "$RUNNER_TEMP/cdx-wheel/bin/cdx" --version
          "$RUNNER_TEMP/cdx-wheel/bin/cdx" schema --json

name: Publish PyPI

on:
  release:
    types:
      - published
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to validate before publishing, for example v0.9.8
        required: true

jobs:
  # Publishing is gated on the tray assets building first. They run from the
  # same release event, so without this they run *beside* each other: a failed
  # or half-finished asset build would leave npm and PyPI already carrying a
  # version whose release has no companion to install. Unpublishing those is
  # not something either registry makes easy, and `cdx tray install` would
  # refuse an asset that never arrived.
  wait-for-assets:
    name: Wait for the tray assets
    runs-on: ubuntu-latest
    # Reading another workflow's runs needs actions:read, and this job has no
    # checkout to infer the repository from, so gh is told explicitly.
    permissions:
      actions: read
      contents: read
    steps:
      - name: Wait for the tray asset build to succeed
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: |
          set -euo pipefail
          for _ in $(seq 1 60); do
            status="$(gh run list --workflow build-tray-assets.yml \
              --branch "$RELEASE_TAG" --limit 1 \
              --json status,conclusion -q '.[0].status + " " + (.[0].conclusion // "")' || true)"
            case "$status" in
              "completed success") echo "Tray assets are built."; exit 0 ;;
              "completed "*) echo "Tray asset build did not succeed: $status"; exit 1 ;;
              "") echo "No asset run yet; waiting." ;;
              *) echo "Asset build $status; waiting." ;;
            esac
            sleep 20
          done
          echo "Timed out waiting for the tray asset build."
          exit 1

  publish:
    name: Publish package
    needs: wait-for-assets
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || startsWith(github.event.release.tag_name, 'v')
    permissions:
      actions: read
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Set up Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: python -m pip install -e ".[dev]"

      - name: Verify release CI passed
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.event.release.tag_name }}
        run: node bin/python-runner.js scripts/verify_release_ci.py --tag "$RELEASE_TAG" --timeout 900 --interval 20

      - name: Validate release checksums
        env:
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.event.release.tag_name }}
        run: |
          curl -fsSL "https://github.com/${GITHUB_REPOSITORY}/releases/download/${RELEASE_TAG}/release-archives.json" -o /tmp/release-archives.json
          node bin/python-runner.js scripts/verify_release_checksums.py --tag "$RELEASE_TAG" --checksums-file /tmp/release-archives.json

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build package
        run: |
          python -m pip install --upgrade build twine
          python -m build
          python -m twine check dist/*

      - name: Publish
        run: python -m twine upload dist/*
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}

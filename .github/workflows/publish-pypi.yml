name: Publish PyPI

on:
  release:
    types:
      - published

jobs:
  publish:
    name: Publish package
    runs-on: ubuntu-latest
    if: startsWith(github.event.release.tag_name, 'v')
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: python -m pip install -e .

      - name: Validate release checksums
        run: |
          curl -fsSL "https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/main/checksums/release-archives.json" -o /tmp/release-archives.json
          node bin/python-runner.js scripts/verify_release_checksums.py --tag "$GITHUB_REF_NAME" --checksums-file /tmp/release-archives.json

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build package
        run: |
          python -m pip install --upgrade build twine
          python -m build
          python -m twine check dist/*

      - name: Publish
        run: python -m twine upload dist/*
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}

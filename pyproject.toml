[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cdx-manager"
version = "0.9.11"
description = "Terminal session manager for Codex and Claude accounts."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
authors = [
  { name = "Alexandre Agostini" }
]
keywords = ["codex", "claude", "cli", "terminal", "session-manager", "ai-tools"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development",
  "Topic :: Terminals",
]
dependencies = ["cryptography>=42"]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "pytest-cov>=5",
  "ruff>=0.6",
]

[project.urls]
Homepage = "https://github.com/AlexAgo83/cdx-manager"
Repository = "https://github.com/AlexAgo83/cdx-manager.git"
Issues = "https://github.com/AlexAgo83/cdx-manager/issues"
Changelog = "https://github.com/AlexAgo83/cdx-manager/tree/main/changelogs"

[project.scripts]
cdx = "cdx_manager.cli:cli_entry"

[tool.setuptools]
packages = ["cdx_manager"]

[tool.setuptools.package-dir]
cdx_manager = "src"

[tool.pytest.ini_options]
testpaths = ["test"]
python_files = ["test_*_py.py"]

[tool.coverage.run]
branch = true
source = ["src"]

[tool.coverage.report]
show_missing = true
skip_empty = true

[tool.ruff]
target-version = "py39"
line-length = 140

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
# Deferred / stylistic-only: E501 (140-col overflows), E741/E731 naming & lambda
# style. Not chasing these now; logic-catching rules (F, bugbear B) stay on.
ignore = ["E501", "E741", "E731"]

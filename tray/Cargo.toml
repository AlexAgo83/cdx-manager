[package]
name = "cdx-tray"
version = "0.17.1"
edition = "2021"
description = "Optional CDX system tray companion"
publish = false

[[bin]]
name = "cdx-tray"
path = "src/main.rs"

[dependencies]
# The companion parses one JSON document and does nothing else with data, so
# serde_json alone is the whole dependency budget until item_080 adds a tray
# backend. adr_005 rules out a webview or application framework.
serde_json = "1"

[profile.release]
strip = true
lto = true
opt-level = "z"

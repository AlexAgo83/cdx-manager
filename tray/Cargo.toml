[package]
name = "cdx-tray"
version = "0.17.1"
edition = "2021"
description = "Optional CDX system tray companion"
publish = false

[[bin]]
name = "cdx-tray"
path = "src/main.rs"

[dependencies]
# The whole dependency budget. adr_005 rules out a webview and an application
# framework: the UI is an icon plus a native menu, so tray-icon and muda are the
# same crates a framework would use underneath, without the layer above them.
# Linux deliberately gets ksni instead, so the asset carries no gtk, libxdo, or
# libayatana-appindicator prerequisite.
png = "0.18.1"
serde_json = "1"

[profile.release]
strip = true
lto = true
opt-level = "z"

# tray-icon and muda only where they are the right answer. On Linux they would
# drag gtk3, libxdo and libayatana-appindicator in as hard runtime prerequisites,
# so Linux gets ksni instead and the asset carries no C library at all.
[target.'cfg(any(target_os = "macos", target_os = "windows"))'.dependencies]
muda = { version = "0.19", default-features = false }
tray-icon = { version = "0.24", default-features = false }

[target.'cfg(target_os = "macos")'.dependencies]
# tray-icon needs a running NSApplication event loop. These two provide it in a
# few lines; winit or tao would provide the same thing plus a windowing stack
# this companion never opens a window with.
objc2 = "0.6"
# The menu-cell features are named explicitly: objc2-app-kit gates every class
# behind one, and a missing feature is a compile error rather than a silent gap.
objc2-app-kit = { version = "0.3", features = [
  "NSMenu", "NSMenuItem", "NSView", "NSTextField", "NSControl",
  "NSColor", "NSFont", "NSResponder", "NSGraphics", "NSCell",
  # The status item is how the companion reaches the menu that is actually on
  # screen, which is the only one whose delegate survives `set_menu`.
  "NSStatusItem", "NSStatusBar", "NSStatusBarButton", "NSButton",
] }
objc2-foundation = "0.3"
# Already in the tree through tray-icon. Naming it directly costs nothing to
# download and is what lets the companion post its own notifications, which
# carry the CDX name and icon, instead of shelling out to osascript and having
# every alert attributed to Script Editor.
block2 = "0.6"

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_UI_WindowsAndMessaging", "Win32_Foundation"] }

[target.'cfg(target_os = "linux")'.dependencies]
# Default features keep zbus's async-io backend; the blocking feature is what
# lets the tray run without this binary owning an async runtime.
ksni = { version = "0.3", features = ["blocking"] }

[package]
name = "cdx-tray"
version = "0.17.1"
edition = "2021"
description = "Optional CDX system tray companion"
publish = false

[[bin]]
name = "cdx-tray"
path = "src/main.rs"

[dependencies]
# The whole dependency budget. adr_005 rules out a webview and an application
# framework: the UI is an icon plus a native menu, so tray-icon and muda are the
# same crates a framework would use underneath, without the layer above them.
# Linux deliberately gets ksni instead, so the asset carries no gtk, libxdo, or
# libayatana-appindicator prerequisite.
muda = "0.19"
png = "0.18.1"
serde_json = "1"
tray-icon = "0.24"

[profile.release]
strip = true
lto = true
opt-level = "z"

[target.'cfg(target_os = "macos")'.dependencies]
# tray-icon needs a running NSApplication event loop. These two provide it in a
# few lines; winit or tao would provide the same thing plus a windowing stack
# this companion never opens a window with.
objc2 = "0.6"
objc2-app-kit = "0.3"
objc2-foundation = "0.3"
